
spring.application.name=witcher-toolkit-back
server.servlet.context-path=/witcher-toolkit
server.port=8081

# ============================================
# CONFIGURATION POSTGRESQL (Docker)
# ============================================

spring.datasource.url=jdbc:postgresql://localhost:5432/witcher_db
spring.datasource.username=witcher_user
spring.datasource.password=Team_Witcher_Dev!2025
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# HIBERNATE / JPA
# ============================================

# none : Hibernate ne g\u00E8re pas le sch\u00E9ma (g\u00E9r\u00E9 par Docker)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Debug SQL (optionnel)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# MYBATIS
# ============================================

# Chemin des entit\u00E9s (domaines)
mybatis.type-aliases-package=fr.meya.witcher.model

# IMPORTANT pour PostgreSQL : gestion des NULL
mybatis.configuration.jdbc-type-for-null=NULL

# Sch\u00E9ma par d\u00E9faut (\u00E9vite de pr\u00E9fixer witcher. partout)
mybatis.configuration.default-schema=witcher

# Mapping automatique snake_case <-> camelCase
mybatis.configuration.map-underscore-to-camel-case=true

# Formatage SQL dans les logs (facultatif)
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ============================================
# INITIALISATION SQL - D\u00C9SACTIV\u00C9
# ============================================
# Les tables et donn\u00E9es sont cr\u00E9\u00E9es par Docker via /infrastructure/init-scripts/
# Spring n'a plus besoin de g\u00E9rer l'initialisation SQL

spring.sql.init.mode=never

# ===========================================
# SECURITY & JWT CONFIGURATION
# ===========================================
# TRES IMPORTANT : Cette clé DOIT être strictement IDENTIQUE à celle de QuestConnect
jwt.secret=ChangeThisSecretToAStrongRandomStringForProduction1234567890123456789012345678901234567890

# Info : WTB ne génère pas de token, mais ces clés l'aident à le lire (parsing)
jwt.header=Authorization
jwt.prefix=Bearer 
jwt.expiration=86400000

# ===========================================
# LOGGING SECURITE
# ===========================================
logging.level.org.springframework.security=DEBUG
logging.level.fr.meya.witcher.security=DEBUG

# ============================================
# PROFIL ACTIF
# ============================================

spring.profiles.active=dev